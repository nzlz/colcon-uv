[metadata]
name = colcon-uv
version = attr: colcon_uv.__version__
url = https://github.com/nzlz/colcon-uv
project_urls =
    Changelog = https://github.com/nzlz/colcon-uv/blob/main/CHANGELOG.md
    GitHub = https://github.com/nzlz/colcon-uv/
author = Nestor Gonzalez
author_email = nestor94gonzalez@gmail.com
maintainer = Nestor Gonzalez
maintainer_email = nestor94gonzalez@gmail.com
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Plugins
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python
    Topic :: Software Development :: Build Tools
license = MIT
description = A Colcon extension for ROS packages with PyPI dependencies managed by UV (Python, and C++ built by ament_cmake)
long_description = file: README.md
long_description_content_type = text/markdown
keywords = colcon

[options]
install_requires =
    colcon-core~=0.6
    tomli>=1.2.0
packages = find:
zip_safe = true

[options.packages.find]
include =
    colcon_uv
    colcon_uv.*

[options.entry_points]
colcon_core.package_augmentation =
    uv = colcon_uv.package_augmentation.uv:UvPackageAugmentation
colcon_core.package_identification =
    uv = colcon_uv.package_identification.uv:UvPackageIdentification
colcon_core.task.build =
    uv.python = colcon_uv.task.uv.build:UvBuildTask
    ros.ament_cmake.uv = colcon_uv.task.uv.ament_cmake:UvAmentCmakeBuildTask
colcon_core.task.test =
    uv.python = colcon_uv.task.uv.test:UvTestTask
    ros.ament_cmake.uv = colcon_uv.task.uv.ament_cmake:UvAmentCmakeTestTask
colcon_core.verb =
    uv = colcon_uv.cli:UvVerb
